[package]
name = "lambda-expr"
version = "0.1.1-beta"
edition = "2024"
description = "Crate for evaluating string expressions in hot loops"
license = "MIT"
repository = "https://github.com/Austin-Bennett/lambda-expr.git"
exclude = ["src/test", "src/tests.rs"]
readme = "README.md"

[features]
jit-compile = ["dep:inkwell", "dep:ouroboros"]

[dependencies]
anyhow = "1.0.102"
lazy_static = "1.5.0"
placenew = "3.0.0"
strum = { version = "0.28.0", features = ["derive"] }
inkwell = { version = "0.9.0", features = ["llvm22-1"], optional = true }
ouroboros = { version = "0.18.5", optional = true }

[profile.release]
opt-level = 3        # Full optimizations
lto = "fat"          # Link Time Optimization: enable full LTO
#codegen-units = 1    # Reduce parallel code generation units for better optimization
panic = "abort"      # Abort on panic, removes unwinding code
strip = true         # Strip symbols from binary
debug = false        # Disable debug info